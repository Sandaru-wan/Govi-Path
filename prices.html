<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetable Prices - Govi Path 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Specific Styles for Prices Cards */
        .items-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 30px; 
            width: 100%;
        }

        .item-card { 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            transition: all 0.3s ease; /* Animation speed */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between;
            border-left: 5px solid var(--primary-green);
        }

        /* Hover Animation: Card lifts up */
        .item-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); 
        }

        .item-card h3 { 
            color: var(--primary-green); 
            font-size: 1.5rem; 
            margin-bottom: 10px; 
            font-weight: 700; 
            text-transform: capitalize; 
        }
        
        .item-card p { 
            font-size: 0.9rem; 
            color: #555; 
            margin-bottom: 5px; 
            font-weight: 500; 
        }

        .price { 
            font-size: 1.3rem; 
            font-weight: bold; 
            color: #D32F2F; 
            margin: 15px 0; 
            display: block; 
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="Logo.jpeg" alt="Logo"> 
            <h2>Govi Path 360</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="prices.html" class="active">Prices</a></li>
                <li><a href="storage.html">Storage</a></li>
                <li><a href="index.html">Log Out</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="page-title">Vegetable Prices</h1>
        
        <div class="green-card" style="min-height: 500px;">
            
            <div class="add-btn-container" style="text-align: right; margin-bottom: 30px;">
                <a href="add-harvest.html" class="btn-main" style="background: white; color: var(--primary-green);">+ Add Your Harvest</a>
            </div>

            <div class="items-grid" id="itemsContainer">
                
                <div class="item-card">
                    <h3>Carrots</h3>
                    <p>Farmer: Sunil</p>
                    <p>Qty: 50 kg</p>
                    <span class="price">Rs. 250 / kg</span>
                    <a href="tel:0771234567" class="btn-main" style="padding: 8px 30px; font-size: 0.9rem;">Call Seller</a>
                </div>

                <div class="item-card">
                    <h3>Potatoes</h3>
                    <p>Farmer: Nimal</p>
                    <p>Qty: 100 kg</p>
                    <span class="price">Rs. 180 / kg</span>
                    <a href="tel:0711234567" class="btn-main" style="padding: 8px 30px; font-size: 0.9rem;">Call Seller</a>
                </div>

                <div class="item-card">
                    <h3>Leeks</h3>
                    <p>Farmer: Bandara</p>
                    <p>Qty: 60 kg</p>
                    <span class="price">Rs. 150 / kg</span>
                    <a href="tel:0701234567" class="btn-main" style="padding: 8px 30px; font-size: 0.9rem;">Call Seller</a>
                </div>

            </div>
        </div>
    </div>
    
    <footer>&copy; 2025 Govi360</footer>

    <script>
        window.onload = function() {
            const storedData = JSON.parse(localStorage.getItem('harvestData')) || [];
            
            const container = document.getElementById('itemsContainer');

            storedData.forEach(item => {
                const farmerName = item.farmer || "You"; 
                
                const cardHTML = `
                <div class="item-card" style="border: 2px solid #4CAF50;">
                    <h3>${item.crop}</h3>
                    <p>Farmer: ${farmerName}</p>
                    <p>Qty: ${item.price} kg</p> 
                    <span class="price">Rs. ${item.price} / kg</span>
                    <a href="tel:${item.phone}" class="btn-main" style="padding: 8px 30px; font-size: 0.9rem;">Call Seller</a>
                </div>`;
                
                container.innerHTML = cardHTML + container.innerHTML;
            });
        };
    </script>
</body>
</html>
