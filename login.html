<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Govi Path 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="Logo.jpeg" alt="Logo"> <h2>Govi Path 360</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="prices.html">Prices</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="glass-card">
            <h2 style="color: var(--dark-green); margin-bottom: 20px;">LOGIN</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" class="form-control" id="phone" placeholder="077 123 4567" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" id="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-main" style="width: 100%;">Log In</button>
            </form>
            <p style="margin-top: 20px; font-size: 0.9rem;">
                Don't have an account? <a href="signup.html" style="color: var(--primary-green); font-weight: bold;">Signup</a>
            </p>
        </div>
    </div>
    <footer>&copy; 2025 Govi360</footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('password').value;
            if(phone && pass) {
                alert("Login Successful!");
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
