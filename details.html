<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Govi Path 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            /* Consistent Background */
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('Bg2.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* Consistent Header */
        header { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-container img { height: 50px; }
        .logo-container h2 { color: #388E3C; font-size: 1.5rem; }
        
        /* Navigation Styles */
        nav ul { list-style: none; display: flex; gap: 15px; }
        
        nav ul li a { 
            text-decoration: none; 
            color: #333; 
            padding: 8px 25px; 
            border: 2px solid #388E3C; 
            border-radius: 25px; 
            background: white; 
            font-weight: 600; 
            transition: 0.3s;
            font-size: 0.9rem;
        }

        /* GREEN HOVER EFFECT */
        nav ul li a:hover, nav ul li a.active {
            background-color: #388E3C;
            color: white;
            cursor: pointer;
        }

        .container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        
        .page-title { 
            color: white; 
            font-size: 2.5rem; 
            margin-bottom: 30px; 
            font-weight: 700; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            text-align: center;
        }

        /* Modern Green Box */
        .profile-card {
            background-color: rgba(46, 82, 48, 0.9); /* Deep Green */
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px; 
            padding: 40px;
            color: white; 
            width: 100%; 
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            margin-bottom: 15px;
            align-items: center;
        }

        .form-row label { font-weight: 600; font-size: 1rem; color: white; }

        .form-control {
            width: 100%; padding: 10px 15px; border-radius: 10px; border: none;
            background: white; font-size: 0.95rem; color: #333; outline: none; font-family: 'Poppins', sans-serif;
        }

        /* Read-only ID */
        .farmer-id { background-color: #e0e0e0; color: #555; font-weight: bold; cursor: not-allowed; }

        /* Submit Button */
        .btn-complete {
            background: white; 
            color: #388E3C; 
            border: none;
            padding: 12px 30px; 
            border-radius: 25px; 
            font-weight: bold; 
            font-size: 1.1rem;
            margin-top: 30px; 
            cursor: pointer; 
            display: block; 
            width: 100%;
            transition: 0.3s;
        }
        .btn-complete:hover { 
            background: #4CAF50; 
            color: white; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        footer { background-color: #f1f8e9; text-align: center; padding: 15px; font-size: 0.8rem; font-weight: 600; color: #333; }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; gap: 5px; }
            .form-row label { margin-bottom: 5px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="Logo.jpeg" alt="Logo"> 
            <h2>Govi Path 360</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="prices.html">Prices</a></li>
                <li><a href="storage.html">Storage</a></li>
                <li><a href="login.html" class="active">Account</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="page-title">Fill Your Account Details</h1>
        
        <div class="profile-card">
            <form action="index.html"> 
                
                <div class="form-row">
                    <label>1. Farmer ID (Auto) :</label>
                    <input type="text" class="form-control farmer-id" value="FMR-2025-001" readonly>
                </div>

                <div class="form-row">
                    <label>2. Full Name :</label>
                    <input type="text" class="form-control" placeholder="Enter Full Name" required>
                </div>

                <div class="form-row">
                    <label>3. Gender :</label>
                    <select class="form-control">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>4. Date of Birth :</label>
                    <input type="date" class="form-control">
                </div>

                <div class="form-row">
                    <label>5. Address :</label>
                    <input type="text" class="form-control" placeholder="Village, District, Province">
                </div>

                <div class="form-row">
                    <label>6. Contact Number :</label>
                    <input type="tel" class="form-control" placeholder="077 123 4567">
                </div>

                <div class="form-row">
                    <label>7. Email Address :</label>
                    <input type="email" class="form-control" placeholder="sample@gmail.com">
                </div>

                <div class="form-row">
                    <label>8. NIC / National ID :</label>
                    <input type="text" class="form-control" placeholder="Enter NIC Number">
                </div>

                <div class="form-row">
                    <label>9. Type of Farmer :</label>
                    <select class="form-control">
                        <option value="">Select Type</option>
                        <option value="Small-scale">Small-scale</option>
                        <option value="Commercial">Commercial</option>
                        <option value="Organic">Organic</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>10. Land Area (Acres) :</label>
                    <input type="number" class="form-control" placeholder="Ex: 2">
                </div>

                <button type="submit" class="btn-complete">Complete & Go Home</button>
            </form>
        </div>
    </div>
    <footer>&copy; 2025 Govi360</footer>
</body>
</html>
